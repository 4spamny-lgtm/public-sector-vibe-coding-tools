<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>전체 위원회 운영 대시보드 · DEMO</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#182235;--muted:#667085;--line:#e5eaf2;--nav:#15385f;--blue:#2f67b8}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,#122e4f,#245f9e);color:#fff;padding:26px 32px}header small{opacity:.7;font-weight:700}header h1{margin:5px 0 4px;font-size:28px}.wrap{max-width:1260px;margin:auto;padding:24px}.notice{background:#fff5d9;border:1px solid #ead89f;padding:11px 14px;border-radius:10px;margin-bottom:16px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(30,55,85,.05)}.card{padding:17px}.card span{color:var(--muted);font-size:12px}.card b{font-size:27px;display:block;margin-top:5px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.panel{padding:20px}.panel h2{font-size:17px;margin:0 0 14px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{background:#f8fafc;color:#475467}.bar{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;margin:12px 0}.track{height:10px;background:#eef2f6;border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#2f67b8,#1c8b78)}@media(max-width:760px){.kpis,.grid{grid-template-columns:1fr 1fr}.wrap{padding:14px}} </style></head><body>
<header><small>PUBLIC DEMO · SAMPLE DATA</small><h1>전체 위원회 운영 대시보드</h1><div>가상 데이터로 구성된 공개용 데모입니다.</div></header><main class="wrap"><div class="notice"><b>DEMO 데이터</b> — 실제 위원명·연락처·내부자료는 포함하지 않습니다.</div><section class="kpis"><div class="card"><span>위원회 수</span><b>8</b></div><div class="card"><span>전체 위원</span><b>126</b></div><div class="card"><span>올해 회의</span><b>37</b></div><div class="card"><span>여성위원 비율</span><b>46.8%</b></div></section><section class="grid"><div class="panel"><h2>실·국별 위원회</h2><div class="bar"><span>경제실</span><div class="track"><div class="fill" style="width:86%"></div></div><b>6</b></div><div class="bar"><span>복지국</span><div class="track"><div class="fill" style="width:58%"></div></div><b>4</b></div><div class="bar"><span>청년기회국</span><div class="track"><div class="fill" style="width:43%"></div></div><b>3</b></div><div class="bar"><span>기후환경국</span><div class="track"><div class="fill" style="width:29%"></div></div><b>2</b></div></div><div class="panel"><h2>최근 회의</h2><table><thead><tr><th>위원회</th><th>일자</th><th>구분</th></tr></thead><tbody><tr><td>예시 일자리위원회</td><td>2026-09-03</td><td>본회의</td></tr><tr><td>예시 청년정책위원회</td><td>2026-08-28</td><td>분과위</td></tr><tr><td>예시 기업지원위원회</td><td>2026-08-21</td><td>서면</td></tr></tbody></table></div></section></main></body></html>
